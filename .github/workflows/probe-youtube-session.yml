name: probe-youtube-session
# 10-27 (USER: "use the Gemini bridge's Google session for YouTube"): can yt-dlp cut a clip with that saved session?
# No AI tokens. Cookies are never printed.
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
    steps:
      - name: Mask the Drive key
        run: printf '%s' "$GDRIVE_TOKEN_JSON" | jq -r '.. | strings' 2>/dev/null | while IFS= read -r v; do [ ${#v} -ge 8 ] && echo "::add-mask::$v"; done; true
      - uses: actions/checkout@v4
        with: {repository: kapilshipturtle/night-studio, ref: main, token: "${{ secrets.NIGHT_CODE_TOKEN }}", path: code}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: bash code/scripts/setup-runner.sh
      - run: bash code/scripts/setup-gemini.sh
      - run: python -m pip install -q -U yt-dlp
      - name: Open YouTube once in the saved session, save it back
        working-directory: code
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from night import gemini_local
          from night.drive import Drive
          SESSION = "night:Legends for Sleep/_state/gemini-profile.tar.gz"
          class SD:
              def __init__(self): self.d = Drive(os.environ["GDRIVE_TOKEN_JSON"])
              def get(self, rel, local): self.d._rc("copyto", SESSION, str(local))
              def put(self, local, rel): self.d._rc("copyto", str(local), SESSION)
          home, drv = Path.home(), SD()
          gemini_local.restore_profile(drv, home)
          procs = None
          try:
              procs = gemini_local.start_chrome(home)
              print("gemini account:", gemini_local.wait_signed_in())
              ws = gemini_local._cdp("/json/version")["webSocketDebuggerUrl"]
              gemini_local._ws_call(ws, "Target.createTarget", {"url": "https://www.youtube.com/"})
              time.sleep(25)
              pages = [t for t in gemini_local._cdp("/json") if "youtube.com" in t.get("url", "")]
              if pages:
                  r = gemini_local._ws_call(pages[0]["webSocketDebuggerUrl"], "Runtime.evaluate", {"returnByValue": True,
                      "expression": "!!document.querySelector('#avatar-btn, button#avatar-btn, img#img[alt]')"})
                  print("youtube signed in:", r.get("result", {}).get("result", {}).get("value"))
          finally:
              gemini_local.stop_chrome(procs)
              gemini_local.save_profile(drv, home)
              print("session saved back")
          PY
      - name: Cut 8 seconds with the session's cookies
        run: |
          id=$(yt-dlp --flat-playlist --print "%(id)s" "https://www.youtube.com/results?search_query=pulsar+nasa&sp=EgIwAQ%253D%253D" --playlist-items 1 2>/dev/null)
          echo "video $id"
          yt-dlp --js-runtimes node --remote-components ejs:github --cookies-from-browser "chrome:$HOME/bridge-profile" -f "bv*[height<=1080]/b[height<=1080]/bv*/b" \
            --download-sections "*00:00:10-00:00:18" -o "clip.%(ext)s" "https://www.youtube.com/watch?v=$id" 2>&1 \
            | grep -v -i cookie | tail -6 || true
          ls -la clip.* 2>/dev/null && ffprobe -v error -show_entries format=duration -of csv=p=0 clip.* && echo CUT_OK || echo CUT_FAILED
