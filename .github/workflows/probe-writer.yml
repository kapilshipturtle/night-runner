name: probe-writer
# 10-29: does a Claude account's stored token still work? One tiny turn; prints only OK / the error class, never a token.
on:
  workflow_dispatch:
    inputs:
      account:
        description: "tech | kapil | mann"
        default: tech
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - run: npm i -g -s @anthropic-ai/claude-code@2.1.296
    - name: One tiny turn as ${{ inputs.account }}
      env:
        TOK_TECH: ${{ secrets.CLAUDE_TOKEN_TECH }}
        TOK_KAPIL: ${{ secrets.CLAUDE_TOKEN_KAPIL }}
        TOK_MANN: ${{ secrets.CLAUDE_TOKEN_MANN }}
        ACCOUNT: ${{ inputs.account }}
      run: |
        case "$ACCOUNT" in tech) T="$TOK_TECH";; kapil) T="$TOK_KAPIL";; mann) T="$TOK_MANN";; *) echo "unknown account"; exit 1;; esac
        [ -n "$T" ] || { echo "NO_TOKEN: the secret is empty"; exit 1; }
        out=$(CLAUDE_CODE_OAUTH_TOKEN="$T" claude -p "Reply with exactly the word OK" --output-format json --max-turns 1 \
              --model claude-sonnet-5-5 2>&1) || true
        if echo "$out" | grep -q '"is_error":false' && echo "$out" | grep -q 'OK'; then echo "WRITER_OK ($ACCOUNT)";
        else echo "WRITER_FAILED ($ACCOUNT):"; echo "$out" | grep -oE '"(result|subtype|api_error_status)":[^,]*' | head -5; exit 1; fi
