# Night Studio: one ~2-hour sleep-history film per night, $0 (plan Task 9). Each job resumes from Drive state.
name: night
on:
  # schedule is switched on ONLY after the 2-hour dry run passes (plan Task 10 step 5):
  # schedule:
  #   - cron: "30 16 * * *"        # 22:00 IST
  workflow_dispatch:
concurrency:
  group: night
  cancel-in-progress: false
env:
  CLAUDE_TOKEN_TECH: ${{ secrets.CLAUDE_TOKEN_TECH }}
  CLAUDE_TOKEN_MANN: ${{ secrets.CLAUDE_TOKEN_MANN }}
  CLAUDE_TOKEN_KAPIL: ${{ secrets.CLAUDE_TOKEN_KAPIL }}
  CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
  FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
  KAGGLE_NIGHT_JSON: ${{ secrets.KAGGLE_NIGHT_JSON }}
  GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
  GMAIL_USER: ${{ secrets.GMAIL_USER }}
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  MAIL_TO: ${{ secrets.MAIL_TO }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  NIGHT_CLOUD: "1"
  NIGHT_WORK: /home/runner/night-work
jobs:
  a:
    name: 'A: topic, script, voice, pictures'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
    - name: Mask every secret
      run: "for v in \"$CLAUDE_TOKEN_TECH\" \"$CLAUDE_TOKEN_MANN\" \"$CLAUDE_TOKEN_KAPIL\" \"$FISH_API_KEY\" \"$GMAIL_APP_PASSWORD\" \"$PEXELS_API_KEY\" \"$PIXABAY_API_KEY\"; do [ -n \"$v\" ] && echo \"\
        ::add-mask::$v\"; done\n# JSON secrets: GitHub masks only the whole value, so mask every string inside them too (review I8)\nfor j in \"$CODEX_AUTH_JSON\" \"$KAGGLE_NIGHT_JSON\" \"$GDRIVE_TOKEN_JSON\"\
        ; do\n  [ -n \"$j\" ] && printf '%s' \"$j\" | jq -r '.. | strings' 2>/dev/null | while IFS= read -r v; do\n    [ ${#v} -ge 8 ] && echo \"::add-mask::$v\"; done\ndone; true\n"
    - uses: actions/checkout@v4
      with:
        repository: kapilshipturtle/night-studio
        token: ${{ secrets.NIGHT_CODE_TOKEN }}
        path: code
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Tools
      run: bash code/scripts/setup-runner.sh
    - name: Night setup (stock scorer, voice library)
      run: bash code/scripts/setup-night.sh --stock
    - name: Job A
      working-directory: code
      run: python -m night.main job-a
  b:
    name: 'B: Kaggle T4 render'
    needs: a
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
    - name: Mask every secret
      run: "for v in \"$CLAUDE_TOKEN_TECH\" \"$CLAUDE_TOKEN_MANN\" \"$CLAUDE_TOKEN_KAPIL\" \"$FISH_API_KEY\" \"$GMAIL_APP_PASSWORD\" \"$PEXELS_API_KEY\" \"$PIXABAY_API_KEY\"; do [ -n \"$v\" ] && echo \"\
        ::add-mask::$v\"; done\n# JSON secrets: GitHub masks only the whole value, so mask every string inside them too (review I8)\nfor j in \"$CODEX_AUTH_JSON\" \"$KAGGLE_NIGHT_JSON\" \"$GDRIVE_TOKEN_JSON\"\
        ; do\n  [ -n \"$j\" ] && printf '%s' \"$j\" | jq -r '.. | strings' 2>/dev/null | while IFS= read -r v; do\n    [ ${#v} -ge 8 ] && echo \"::add-mask::$v\"; done\ndone; true\n"
    - uses: actions/checkout@v4
      with:
        repository: kapilshipturtle/night-studio
        token: ${{ secrets.NIGHT_CODE_TOKEN }}
        path: code
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Tools
      run: bash code/scripts/setup-runner.sh
    - name: Job B
      working-directory: code
      run: python -m night.main job-b
  c:
    name: 'C: title, description, thumbnails, Drive, email'
    needs: b
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Mask every secret
      run: "for v in \"$CLAUDE_TOKEN_TECH\" \"$CLAUDE_TOKEN_MANN\" \"$CLAUDE_TOKEN_KAPIL\" \"$FISH_API_KEY\" \"$GMAIL_APP_PASSWORD\" \"$PEXELS_API_KEY\" \"$PIXABAY_API_KEY\"; do [ -n \"$v\" ] && echo \"\
        ::add-mask::$v\"; done\n# JSON secrets: GitHub masks only the whole value, so mask every string inside them too (review I8)\nfor j in \"$CODEX_AUTH_JSON\" \"$KAGGLE_NIGHT_JSON\" \"$GDRIVE_TOKEN_JSON\"\
        ; do\n  [ -n \"$j\" ] && printf '%s' \"$j\" | jq -r '.. | strings' 2>/dev/null | while IFS= read -r v; do\n    [ ${#v} -ge 8 ] && echo \"::add-mask::$v\"; done\ndone; true\n"
    - uses: actions/checkout@v4
      with:
        repository: kapilshipturtle/night-studio
        token: ${{ secrets.NIGHT_CODE_TOKEN }}
        path: code
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Tools
      run: bash code/scripts/setup-runner.sh
    - name: Night setup
      run: bash code/scripts/setup-night.sh
    - name: Job C
      working-directory: code
      run: python -m night.main job-c
  notify:
    needs:
    - a
    - b
    - c
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    steps:
    - name: Mask every secret
      run: "for v in \"$CLAUDE_TOKEN_TECH\" \"$CLAUDE_TOKEN_MANN\" \"$CLAUDE_TOKEN_KAPIL\" \"$FISH_API_KEY\" \"$GMAIL_APP_PASSWORD\" \"$PEXELS_API_KEY\" \"$PIXABAY_API_KEY\"; do [ -n \"$v\" ] && echo \"\
        ::add-mask::$v\"; done\n# JSON secrets: GitHub masks only the whole value, so mask every string inside them too (review I8)\nfor j in \"$CODEX_AUTH_JSON\" \"$KAGGLE_NIGHT_JSON\" \"$GDRIVE_TOKEN_JSON\"\
        ; do\n  [ -n \"$j\" ] && printf '%s' \"$j\" | jq -r '.. | strings' 2>/dev/null | while IFS= read -r v; do\n    [ ${#v} -ge 8 ] && echo \"::add-mask::$v\"; done\ndone; true\n"
    - uses: actions/checkout@v4
      with:
        repository: kapilshipturtle/night-studio
        token: ${{ secrets.NIGHT_CODE_TOKEN }}
        path: code
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install -q -r code/requirements-runner.txt && curl -sSL https://rclone.org/install.sh | sudo bash >/dev/null
    - name: Email the stage and error
      working-directory: code
      run: python -m night.main notify
    timeout-minutes: 20
  keepalive:
    name: Keep the nightly schedule enabled
    if: ${{ always() }}
    needs:
    - c
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    - name: Re-enable this workflow (GitHub turns schedules off after 60 days without repo activity)
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/night.yml/enable
