# Night Studio: one ~2-hour sleep-history film per night, $0 (plan Task 9). Each job resumes from Drive state.
name: night
on:
  schedule:
    - cron: "31 14 * * *"          # 20:01 IST, both channels side by side (USER 10-29: "in morning i expect 2 videos")
  workflow_dispatch:
    inputs:
      minutes:
        description: "Film length in minutes (5 = the short full-flow test; USER 10-24: always test small first)"
        default: "120"
      test:
        description: "Test run: own state file, '[TEST]' title, the topic is not marked as made"
        type: boolean
        default: false
      channel:
        description: "Which channel: history (Night Studio, default) or legends (Legends for Sleep)"
        default: "history"
      code_ref:
        description: "night-studio branch to run (tests of a new route run their branch; nightly films run main)"
        default: "main"
      attempt:
        description: "Automatic retry counter (1 = first try; a failed night retries itself up to attempt 3)"
        default: "1"
      full_after:
        description: "After a passing test, start the full 2-hour film right away"
        type: boolean
        default: true
concurrency:
  group: night-${{ inputs.channel || 'history' }}${{ inputs.test && '-test' || '' }}
  cancel-in-progress: false
env:
  CLAUDE_TOKEN_TECH: ${{ secrets.CLAUDE_TOKEN_TECH }}
  CLAUDE_TOKEN_MANN: ${{ secrets.CLAUDE_TOKEN_MANN }}
  # USER 10-24: the token saved under the TECH name is kapil's; KAPIL wins once it is set
  CLAUDE_TOKEN_KAPIL: ${{ secrets.CLAUDE_TOKEN_KAPIL || secrets.CLAUDE_TOKEN_TECH }}
  CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
  FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
  KAGGLE_NIGHT_JSON: ${{ secrets.KAGGLE_NIGHT_JSON }}
  KAGGLE_NIGHT_JSON_2: ${{ secrets.KAGGLE_NIGHT_JSON_2 }}
  GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
  NIGHT_CLAUDE_ACCOUNTS: ${{ vars.NIGHT_CLAUDE_ACCOUNTS }}   # temporary writer account switch; unset = settings (kapil)
  GDRIVE_TOKEN_JSON_LEGENDS: ${{ secrets.GDRIVE_TOKEN_JSON_LEGENDS }}   # science channel's own Google account (USER 10-27)
  GMAIL_USER: ${{ secrets.GMAIL_USER }}
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  MAIL_TO: ${{ secrets.MAIL_TO }}
  # no Gmail password: the message becomes an issue here and GitHub emails it (no login needed)
  GITHUB_TOKEN: ${{ github.token }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  # Gemini route (USER 10-24): job A starts/stops the vast.ai bridge box and reaches it over SSH
  VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
  BRIDGE_SSH_KEY: ${{ secrets.BRIDGE_SSH_KEY }}
  NIGHT_CLOUD: "1"
  NIGHT_TARGET_MINUTES: ${{ inputs.minutes || '120' }}
  NIGHT_TEST: ${{ inputs.test && '1' || '' }}
  NIGHT_CODE_REF: ${{ inputs.code_ref || 'main' }}
  NIGHT_CHANNEL: ${{ inputs.channel || 'history' }}       # USER 10-25: Legends for Sleep runs after History     # a follow-up run (long render) keeps the same code
  PYTHONUNBUFFERED: "1"            # progress lines reach the Actions log as they happen
  NIGHT_WORK: /home/runner/night-work
permissions:
  contents: read
  issues: write
  actions: write
jobs:
  a:
    name: 'A: topic, script, voice, pictures'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
    - name: Mask every secret
      run: "for v in \"$CLAUDE_TOKEN_TECH\" \"$CLAUDE_TOKEN_MANN\" \"$CLAUDE_TOKEN_KAPIL\" \"$FISH_API_KEY\" \"$GMAIL_APP_PASSWORD\" \"$PEXELS_API_KEY\" \"$PIXABAY_API_KEY\" \"$VAST_API_KEY\"; do [ -n \"$v\" ] && echo \"\
        ::add-mask::$v\"; done\n# JSON secrets: GitHub masks only the whole value, so mask every string inside them too (review I8)\nfor j in \"$CODEX_AUTH_JSON\" \"$KAGGLE_NIGHT_JSON\" \"$KAGGLE_NIGHT_JSON_2\"\
        \ \"$GDRIVE_TOKEN_JSON\" \"$GDRIVE_TOKEN_JSON_LEGENDS\"; do\n  [ -n \"$j\" ] && printf '%s' \"$j\" | jq -r '.. | strings' 2>/dev/null | while IFS= read -r v; do\n    [ ${#v} -ge 8 ] && echo \"::add-mask::$v\"; done\ndone; true\n"
    - uses: actions/checkout@v4
      with:
        repository: kapilshipturtle/night-studio
        ref: ${{ inputs.code_ref || 'main' }}
        token: ${{ secrets.NIGHT_CODE_TOKEN }}
        path: code
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Tools
      timeout-minutes: 20
      run: bash code/scripts/setup-runner.sh
    - name: Cached scorer + ffmpeg (no 1 GB download on a normal night)
      uses: actions/cache@v4
      with:
        path: |
          ~/.hyperframes-tools/stock-venv
          ~/.hyperframes-tools/ffmpeg7
        key: night-tools-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('code/scripts/setup-night.sh') }}
    - name: Night setup (stock scorer, voice library)
      timeout-minutes: 30
      run: bash code/scripts/setup-night.sh --stock
    - name: Gemini Chrome (Legends pictures on this machine)
      # 10-27: the channel became science with REAL clips; Gemini only if switched back on (one less step to fail)
      if: ${{ (inputs.channel || 'history') == 'legends' && vars.LEGENDS_GEMINI == 'on' }}
      timeout-minutes: 15
      run: bash code/scripts/setup-gemini.sh
    - name: Bridge box key
      run: |
        [ -n "$BRIDGE_SSH_KEY" ] || { echo "BRIDGE_SSH_KEY secret missing (Gemini route)"; exit 0; }
        mkdir -p ~/.ssh && printf '%s\n' "$BRIDGE_SSH_KEY" > ~/.ssh/bridge_key && chmod 600 ~/.ssh/bridge_key
        echo "BRIDGE_SSH_KEY_FILE=$HOME/.ssh/bridge_key" >> "$GITHUB_ENV"
    - name: Job A
      working-directory: code
      run: python -m night.main job-a
  b:
    name: 'B: Kaggle T4 render'
    needs: a
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
    - name: Mask every secret
      run: "for v in \"$CLAUDE_TOKEN_TECH\" \"$CLAUDE_TOKEN_MANN\" \"$CLAUDE_TOKEN_KAPIL\" \"$FISH_API_KEY\" \"$GMAIL_APP_PASSWORD\" \"$PEXELS_API_KEY\" \"$PIXABAY_API_KEY\" \"$VAST_API_KEY\"; do [ -n \"$v\" ] && echo \"\
        ::add-mask::$v\"; done\n# JSON secrets: GitHub masks only the whole value, so mask every string inside them too (review I8)\nfor j in \"$CODEX_AUTH_JSON\" \"$KAGGLE_NIGHT_JSON\" \"$KAGGLE_NIGHT_JSON_2\"\
        \ \"$GDRIVE_TOKEN_JSON\" \"$GDRIVE_TOKEN_JSON_LEGENDS\"; do\n  [ -n \"$j\" ] && printf '%s' \"$j\" | jq -r '.. | strings' 2>/dev/null | while IFS= read -r v; do\n    [ ${#v} -ge 8 ] && echo \"::add-mask::$v\"; done\ndone; true\n"
    - uses: actions/checkout@v4
      with:
        repository: kapilshipturtle/night-studio
        ref: ${{ inputs.code_ref || 'main' }}
        token: ${{ secrets.NIGHT_CODE_TOKEN }}
        path: code
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Tools
      timeout-minutes: 20
      run: bash code/scripts/setup-runner.sh
    - name: Job B
      working-directory: code
      run: python -m night.main job-b
  kit:
    name: 'K: title, description, thumbnails (alongside the render)'
    needs: a
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Mask every secret
      run: "for v in \"$CLAUDE_TOKEN_TECH\" \"$CLAUDE_TOKEN_MANN\" \"$CLAUDE_TOKEN_KAPIL\" \"$FISH_API_KEY\" \"$GMAIL_APP_PASSWORD\" \"$PEXELS_API_KEY\" \"$PIXABAY_API_KEY\" \"$VAST_API_KEY\"; do [ -n \"$v\" ] && echo \"\
        ::add-mask::$v\"; done\n# JSON secrets: GitHub masks only the whole value, so mask every string inside them too (review I8)\nfor j in \"$CODEX_AUTH_JSON\" \"$KAGGLE_NIGHT_JSON\" \"$KAGGLE_NIGHT_JSON_2\"\
        \ \"$GDRIVE_TOKEN_JSON\" \"$GDRIVE_TOKEN_JSON_LEGENDS\"; do\n  [ -n \"$j\" ] && printf '%s' \"$j\" | jq -r '.. | strings' 2>/dev/null | while IFS= read -r v; do\n    [ ${#v} -ge 8 ] && echo \"::add-mask::$v\"; done\ndone; true\n"
    - uses: actions/checkout@v4
      with:
        repository: kapilshipturtle/night-studio
        ref: ${{ inputs.code_ref || 'main' }}
        token: ${{ secrets.NIGHT_CODE_TOKEN }}
        path: code
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Tools
      timeout-minutes: 20
      run: bash code/scripts/setup-runner.sh
    - name: Night setup
      timeout-minutes: 30
      run: bash code/scripts/setup-night.sh
    - name: Job kit
      working-directory: code
      run: python -m night.main job-kit
  c:
    name: 'C: Drive folder complete + email'
    needs:
    - b
    - kit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Mask every secret
      run: "for v in \"$CLAUDE_TOKEN_TECH\" \"$CLAUDE_TOKEN_MANN\" \"$CLAUDE_TOKEN_KAPIL\" \"$FISH_API_KEY\" \"$GMAIL_APP_PASSWORD\" \"$PEXELS_API_KEY\" \"$PIXABAY_API_KEY\" \"$VAST_API_KEY\"; do [ -n \"$v\" ] && echo \"\
        ::add-mask::$v\"; done\n# JSON secrets: GitHub masks only the whole value, so mask every string inside them too (review I8)\nfor j in \"$CODEX_AUTH_JSON\" \"$KAGGLE_NIGHT_JSON\" \"$KAGGLE_NIGHT_JSON_2\"\
        \ \"$GDRIVE_TOKEN_JSON\" \"$GDRIVE_TOKEN_JSON_LEGENDS\"; do\n  [ -n \"$j\" ] && printf '%s' \"$j\" | jq -r '.. | strings' 2>/dev/null | while IFS= read -r v; do\n    [ ${#v} -ge 8 ] && echo \"::add-mask::$v\"; done\ndone; true\n"
    - uses: actions/checkout@v4
      with:
        repository: kapilshipturtle/night-studio
        ref: ${{ inputs.code_ref || 'main' }}
        token: ${{ secrets.NIGHT_CODE_TOKEN }}
        path: code
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Tools
      timeout-minutes: 20
      run: bash code/scripts/setup-runner.sh
    - name: Night setup
      timeout-minutes: 30
      run: bash code/scripts/setup-night.sh
    - name: Job C
      working-directory: code
      run: python -m night.main job-c
    if: ${{ always() && needs.b.result == 'success' }}
  notify:
    needs:
    - a
    - b
    - c
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && ((inputs.attempt || '1') == '3' || inputs.test) }}
    runs-on: ubuntu-latest
    steps:
    - name: Mask every secret
      run: "for v in \"$CLAUDE_TOKEN_TECH\" \"$CLAUDE_TOKEN_MANN\" \"$CLAUDE_TOKEN_KAPIL\" \"$FISH_API_KEY\" \"$GMAIL_APP_PASSWORD\" \"$PEXELS_API_KEY\" \"$PIXABAY_API_KEY\" \"$VAST_API_KEY\"; do [ -n \"$v\" ] && echo \"\
        ::add-mask::$v\"; done\n# JSON secrets: GitHub masks only the whole value, so mask every string inside them too (review I8)\nfor j in \"$CODEX_AUTH_JSON\" \"$KAGGLE_NIGHT_JSON\" \"$KAGGLE_NIGHT_JSON_2\"\
        \ \"$GDRIVE_TOKEN_JSON\" \"$GDRIVE_TOKEN_JSON_LEGENDS\"; do\n  [ -n \"$j\" ] && printf '%s' \"$j\" | jq -r '.. | strings' 2>/dev/null | while IFS= read -r v; do\n    [ ${#v} -ge 8 ] && echo \"::add-mask::$v\"; done\ndone; true\n"
    - uses: actions/checkout@v4
      with:
        repository: kapilshipturtle/night-studio
        ref: ${{ inputs.code_ref || 'main' }}
        token: ${{ secrets.NIGHT_CODE_TOKEN }}
        path: code
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install -q -r code/requirements-runner.txt && curl -sSL https://rclone.org/install.sh | sudo bash >/dev/null
    - name: Email the stage and error
      working-directory: code
      run: python -m night.main notify
    timeout-minutes: 20
  keepalive:
    name: Keep the nightly schedule enabled
    if: ${{ always() }}
    needs:
    - c
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    - name: Re-enable this workflow (GitHub turns schedules off after 60 days without repo activity)
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/night.yml/enable
  full_after_test:
    name: 'Test passed: start the 2-hour film'
    needs:
    - c
    if: ${{ success() && inputs.test && inputs.full_after }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    - name: Start the full-length run (queued behind this one by the 'night' concurrency group)
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run night.yml -R ${{ github.repository }} -f minutes=120 -f test=false -f code_ref=${{ inputs.code_ref || 'main' }} -f channel=${{ inputs.channel || 'history' }}
  next_channel:
    name: 'Start tonight''s science film alongside History'
    # USER 10-29 "in morning i expect 2 videos": chained after History, science (~8 h) landed around midday; GitHub also
    # starts the schedule 2-5 h late (MEASURED 10-25..28). Both now start together on their own Kaggle account,
    # Drive and concurrency group.
    if: ${{ github.event_name == 'schedule' && vars.LEGENDS_NIGHTLY == 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    - name: Start tonight's science film now
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run night.yml -R ${{ github.repository }} -f channel=legends -f minutes=120 -f test=false -f code_ref=main -f full_after=false
  retry:
    name: 'Failed: try again in 10 min (resumes from the saved step)'
    needs: [a, b, kit, c]
    if: ${{ failure() && !inputs.test && (inputs.attempt || '1') != '3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
    - name: Wait out a temporary outage, then start the same night again (USER 10-26 - no errors in future runs)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        sleep 600
        gh workflow run night.yml -R ${{ github.repository }} -f channel=${{ inputs.channel || 'history' }} -f minutes=${{ inputs.minutes || '120' }} -f test=false -f code_ref=${{ inputs.code_ref || 'main' }} -f full_after=false -f attempt=${{ (inputs.attempt || '1') == '1' && '2' || '3' }}
